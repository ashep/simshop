openapi: "3.0.0"

info:
  title: SimShop API
  version: "0.5.0"

paths:
  /shop:
    get:
      operationId: getShop
      responses:
        "200":
          description: Shop metadata (all language variants)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShopResponse'

  /products:
    get:
      operationId: listProducts
      responses:
        "200":
          description: List of all products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductItem'

  /products/{id}/{lang}:
    get:
      operationId: getProductContent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail in the requested language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductResponse'
        "404":
          description: Product or language not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{id}/promo-codes/{code}:
    get:
      operationId: checkPromoCode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The code is valid for this product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        "404":
          description: Unknown product or promo code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pages:
    get:
      operationId: listPages
      responses:
        "200":
          description: List of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PageItem'

  /pages/{id}/{lang}:
    get:
      operationId: getPage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page content in the requested language
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Page or language not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nova-poshta/cities:
    get:
      operationId: searchNovaPoshtaCities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NovaPoshtaCityItem'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: Nova Poshta API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nova-poshta/streets:
    get:
      operationId: searchNovaPoshtaStreets
      parameters:
        - name: city_ref
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching streets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NovaPoshtaStreetItem'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: Nova Poshta API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nova-poshta/branches:
    get:
      operationId: searchNovaPoshtaBranches
      parameters:
        - name: city_ref
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NovaPoshtaBranchItem'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: Nova Poshta API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /monobank/webhook:
    post:
      operationId: monobankWebhook
      description: |
        Receives Monobank invoice-status webhook deliveries. Authenticated
        via ECDSA signature in the X-Sign header. Not intended for direct
        external calls — handler bypasses the OpenAPI validator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Processed, idempotent, informational, or unknown reference
        "400":
          description: Malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Invalid X-Sign signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    get:
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: |
            Comma-separated list of order statuses. When supplied, the response
            is filtered to orders whose status matches one of the given values.
            Omit the parameter to disable the filter; an empty value
            (`?status=`) is rejected with 400.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
      responses:
        "200":
          description: All orders, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderRecord'
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: Google Sheets API error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      operationId: getOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusResponse'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stats:
    get:
      operationId: getStats
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          description: Number of UTC days to report, including today.
          schema:
            type: integer
            enum: [7, 14, 30]
            default: 7
      responses:
        "200":
          description: Daily visits and most viewed products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "502":
          description: Analytics provider failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        "200":
          description: Status updated (or idempotent same-status no-op)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusUpdateResponse'
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: Transition not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    SpecItem:
      type: object
      required:
        - title
        - value
      properties:
        title:
          type: string
        value:
          type: string

    PriceItem:
      type: object
      required:
        - currency
        - value
      properties:
        currency:
          type: string
        value:
          type: number

    AttrValue:
      type: object
      required:
        - title
        - prefix
      properties:
        title:
          type: string
        prefix:
          type: string

    AttrLang:
      type: object
      required:
        - title
        - values
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        values:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AttrValue'

    ImageItem:
      type: object
      required:
        - preview
        - full
      properties:
        type:
          type: string
          enum:
            - image
            - video
          default: image
          description: Media kind. Absent or "image" means a still image; "video" means an MP4 clip.
        preview:
          type: string
        full:
          type: string

    GetProductResponse:
      type: object
      required:
        - id
        - available
        - name
        - description
        - price
      properties:
        id:
          type: string
        available:
          type: boolean
        categories:
          type: array
          items:
            type: string
        name:
          type: string
        description:
          type: string
        specs:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/SpecItem'
        price:
          $ref: '#/components/schemas/PriceItem'
        attrs:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/AttrLang'
        attr_prices:
          type: object
          nullable: true
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        attr_images:
          type: object
          nullable: true
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        attr_colors:
          type: object
          nullable: true
          description: Swatch color per attribute value, `#rrggbb`, keyed attr → value (language-independent).
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
        attr_values_order:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
        images:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ImageItem'

    ProductItem:
      type: object
      required:
        - id
        - available
        - title
        - description
      properties:
        id:
          type: string
        available:
          type: boolean
        categories:
          type: array
          items:
            type: string
        title:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
        image:
          type: string
          nullable: true
        images:
          type: array
          description: Up to 2 still previews, starting with `image`; the card swaps to the second on hover.
          items:
            type: string
        price:
          $ref: '#/components/schemas/PriceItem'

    PageItem:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: object
          additionalProperties:
            type: string

    PromoCodeResponse:
      type: object
      required:
        - code
        - discount_percent
      properties:
        code:
          type: string
          description: Canonical spelling of the code
        discount_percent:
          type: integer
          minimum: 1
          maximum: 99
    CreateOrderRequest:
      type: object
      required:
        - product_id
        - lang
        - first_name
        - last_name
        - phone
        - email
        - country
        - city
        - address
      properties:
        product_id:
          type: string
        lang:
          type: string
        attributes:
          type: object
          nullable: true
          additionalProperties:
            type: string
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        phone:
          type: string
        email:
          type: string
        country:
          type: string
        city:
          type: string
        address:
          type: string
        promo_code:
          type: string
          nullable: true
          description: >-
            Optional product promo code; matched case-insensitively. Unknown code → 400 "invalid promo code".
            A code already used by a non-cancelled order with the same phone digits → 400 "promo code already used".
        notes:
          type: string
          nullable: true
        ga_client_id:
          type: string
          nullable: true
          maxLength: 64
          pattern: '^[0-9]+\.[0-9]+$'
          description: >-
            Google Analytics client_id of the buyer's browser (from gtag). Used to attribute the server-side
            `purchase` event to the visitor's traffic source. Omit when analytics is not loaded.
        ga_session_id:
          type: string
          nullable: true
          maxLength: 32
          pattern: '^[0-9]+$'
          description: Google Analytics session_id at checkout; sent with the server-side `purchase` event.
        meta_fbp:
          type: string
          nullable: true
          maxLength: 255
          pattern: '^fb\.[0-9]+\.[0-9]+\.[0-9]+$'
          description: >-
            Meta Pixel `_fbp` cookie. Sent with the server-side Conversions API `Purchase` to match the buyer.
        meta_fbc:
          type: string
          nullable: true
          maxLength: 1024
          pattern: '^fb\.[0-9]+\.[0-9]+\.[A-Za-z0-9_-]+$'
          description: Meta Pixel `_fbc` cookie (set when the visit came from a Meta ad click).

    CreateOrderResponse:
      type: object
      required:
        - payment_url
      properties:
        payment_url:
          type: string

    OrderStatus:
      type: string
      description: |
        Lifecycle status of an order. Mirrors the `order_status` enum in
        `internal/sql/001_init.up.sql`; both must stay in sync when a status
        is added or removed.
      enum:
        - new
        - awaiting_payment
        - payment_processing
        - payment_hold
        - paid
        - processing
        - cancelled
        - shipped
        - delivered
        - refund_requested
        - returned
        - refunded

    OrderStatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    OrderStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
            - cancelled
            - refund_requested
            - returned
            - refunded
        tracking_number:
          type: string
          maxLength: 64
        note:
          type: string
          maxLength: 500
      additionalProperties: false

    OrderStatusUpdateResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
      additionalProperties: false

    Stats:
      type: object
      required:
        - days
        - top_products
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/StatsDay'
        top_products:
          type: array
          items:
            $ref: '#/components/schemas/StatsProduct'

    StatsDay:
      type: object
      required:
        - date
        - visits
      properties:
        date:
          type: string
        visits:
          type: integer

    StatsProduct:
      type: object
      required:
        - id
        - title
        - views
      properties:
        id:
          type: string
        title:
          type: string
        views:
          type: integer

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    ShopResponse:
      type: object
      properties:
        countries:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ShopCountry'
        name:
          type: object
          additionalProperties:
            type: string
        title:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ShopCategory'
        links:
          type: array
          items:
            $ref: '#/components/schemas/ShopLink'
        google_analytics:
          $ref: '#/components/schemas/ShopGoogleAnalytics'
        cloudflare_analytics:
          $ref: '#/components/schemas/ShopCloudflareAnalytics'
        meta_pixel:
          $ref: '#/components/schemas/ShopMetaPixel'
        announcement:
          $ref: '#/components/schemas/LangMap'
        announcement_page:
          type: string
          description: Content page id (pages.yaml) the announcement bar links to.
        hero:
          $ref: '#/components/schemas/ShopHero'
        features:
          type: array
          items:
            $ref: '#/components/schemas/ShopFeature'
        story:
          $ref: '#/components/schemas/ShopStory'
        gallery:
          type: array
          description: Bare filenames under the data dir's assets/ folder (GET /assets/{name}).
          items:
            type: string
        menu:
          type: array
          description: Content page ids (pages.yaml) shown in the storefront header navigation.
          items:
            type: string

    LangMap:
      type: object
      description: Per-language strings keyed by language code.
      additionalProperties:
        type: string

    ShopHero:
      type: object
      properties:
        eyebrow:
          $ref: '#/components/schemas/LangMap'
        title:
          $ref: '#/components/schemas/LangMap'
        text:
          $ref: '#/components/schemas/LangMap'
        images:
          type: array
          description: Rotating slideshow shown under the same text.
          items:
            $ref: '#/components/schemas/ShopHeroImage'

    ShopHeroImage:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          description: Bare filename under assets/.
        category:
          type: string
          description: Shop category id a click on this slide leads to; unset links to the whole catalog.

    ShopFeature:
      type: object
      properties:
        icon:
          type: string
        title:
          $ref: '#/components/schemas/LangMap'
        text:
          $ref: '#/components/schemas/LangMap'

    ShopStory:
      type: object
      properties:
        eyebrow:
          $ref: '#/components/schemas/LangMap'
        title:
          $ref: '#/components/schemas/LangMap'
        text:
          $ref: '#/components/schemas/LangMap'
        image:
          type: string
          description: Bare filename under assets/.
        page:
          type: string
          description: Content page id (pages.yaml) the band links to.

    ShopLink:
      type: object
      required:
        - title
        - icon
        - url
      properties:
        title:
          type: string
        icon:
          type: string
        url:
          type: string

    ShopGoogleAnalytics:
      type: object
      required:
        - id
      properties:
        id:
          type: string

    ShopMetaPixel:
      type: object
      required:
        - id
      properties:
        id:
          type: string

    ShopCloudflareAnalytics:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    ShopCategory:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        title:
          type: object
          additionalProperties:
            type: string

    ShopCountry:
      type: object
      properties:
        name:
          type: object
          additionalProperties:
            type: string
        currency:
          type: object
          additionalProperties:
            type: string
        phone_code:
          type: string
        flag:
          type: string

    NovaPoshtaCityItem:
      type: object
      required:
        - ref
        - name
      properties:
        ref:
          type: string
        name:
          type: string

    NovaPoshtaBranchItem:
      type: object
      required:
        - ref
        - name
      properties:
        ref:
          type: string
        name:
          type: string

    NovaPoshtaStreetItem:
      type: object
      required:
        - ref
        - name
      properties:
        ref:
          type: string
        name:
          type: string

    OrderAttr:
      type: object
      required: [name, value, price]
      properties:
        name:
          type: string
        value:
          type: string
        price:
          type: integer

    OrderHistoryEntry:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    OrderInvoice:
      type: object
      required:
        - provider
        - id
        - page_url
        - amount
        - currency
      properties:
        provider:
          type: string
        id:
          type: string
        page_url:
          type: string
        amount:
          type: integer
        currency:
          type: string

    OrderRecord:
      type: object
      required:
        - id
        - product_id
        - status
        - email
        - price
        - currency
        - lang
        - first_name
        - last_name
        - country
        - city
        - phone
        - address
        - created_at
        - updated_at
        - attrs
        - history
        - invoices
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        email:
          type: string
        price:
          type: integer
        currency:
          type: string
        lang:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        country:
          type: string
        city:
          type: string
        phone:
          type: string
        address:
          type: string
        admin_note:
          type: string
          nullable: true
        customer_note:
          type: string
          nullable: true
        tracking_number:
          type: string
          nullable: true
        promo_code:
          type: string
          nullable: true
          description: Promo code applied to the order (canonical spelling); absent when none.
        discount_percent:
          type: integer
          nullable: true
        discount:
          type: integer
          nullable: true
          description: Discount in minor units; `price` is already net of it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        attrs:
          type: array
          items:
            $ref: '#/components/schemas/OrderAttr'
        history:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistoryEntry'
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/OrderInvoice'

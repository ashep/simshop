<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="description" content="">
  <!-- Favicons are injected by applyAssets() from the backend /assets path. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/offer.css">
</head>
<body>

  <div id="loader" aria-hidden="true"><div class="loader-spinner"></div></div>

  <!-- Header and footer are rendered by main.js from /shop and /pages. -->
  <div id="site-header"></div>

  <main class="main">
    <div id="home-view"></div>

    <div id="catalog-view" style="display:none">
      <section class="page-band">
        <div class="container">
          <nav class="breadcrumbs" aria-label="Breadcrumbs"><a href="/" data-i18n="nav.home">Home</a><span aria-hidden="true">/</span><span aria-current="page" data-i18n="catalog.title">Products</span></nav>
          <h1 class="page-title" data-i18n="catalog.title">Products</h1>
          <p class="page-sub" id="catalog-sub"></p>
        </div>
      </section>
      <div class="catalog-toolbar">
        <div class="container catalog-toolbar-inner">
          <div class="categories" id="category-bar" style="display:none">
            <!-- Populated by main.js -->
          </div>
          <div class="catalog-count" id="catalog-count" aria-live="polite"></div>
        </div>
      </div>
      <section class="container section">
        <div class="grid" id="product-grid">
          <!-- Populated by main.js -->
        </div>
      </section>
    </div>

    <div id="page-view" style="display:none">
      <section class="page-band">
        <div class="container">
          <nav class="breadcrumbs" id="page-breadcrumbs" aria-label="Breadcrumbs"></nav>
          <h1 class="page-title" id="page-title"></h1>
        </div>
      </section>
      <div class="container section">
        <div id="markdown-content" class="prose"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

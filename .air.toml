root = "."
tmp_dir = "tmp"

[build]
  # APP_NAME/APP_VERSION come from `task dev:api` env; build.cmd runs via `sh -c`, so they expand here.
  # No `netgo` tag: see the dev:api comment in Taskfile.yaml.
  cmd = "go build -race -ldflags \"-X 'github.com/ashep/go-apprun.appName=${APP_NAME}' -X 'github.com/ashep/go-apprun.appVer=${APP_VERSION}'\" -o ./tmp/main ."
  entrypoint = ["./tmp/main"]
  # .sql (internal/sql) and .yaml (api/) are go:embed-ed; config.yaml, data/ YAML and data/emails/*.md are read at
  # startup.
  include_ext = ["go", "sql", "yaml", "md"]
  exclude_dir = [".ci", ".claude", ".github", ".idea", ".superpowers", ".worktrees", "cmd", "docs", "frontend", "public", "tests", "tmp", "vendor"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  main_only = false

[misc]
  clean_on_exit = false
